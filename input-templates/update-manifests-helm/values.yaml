replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "#{Octopus.Action.Package[nginx].PackageVersion}"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: update-manifests-helm-#{Octopus.Environment.Name | ToLower}
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

nodeSelector: {}
tolerations: []
affinity: {}
