apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample.fullname" . }}-nginx
  labels:
    {{- include "sample.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sample.selectorLabels" . | nindent 4 }}
    component: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample.fullname" . }}-redis
  labels:
    {{- include "sample.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "sample.selectorLabels" . | nindent 4 }}
    component: redis
