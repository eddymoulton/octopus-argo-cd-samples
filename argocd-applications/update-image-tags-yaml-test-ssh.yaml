apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: update-image-tags-yaml-test-ssh
  annotations:
    argo.octopus.com/project: "update-image-tags-yaml"
    argo.octopus.com/environment: "test"
spec:
  project: default
  source:
    repoURL: git@github.com:eddymoulton/octopus-argo-cd-samples.git
    targetRevision: HEAD
    path: manifests/update-image-tags-yaml/test-ssh/
  destination:
    server: https://kubernetes.default.svc
    namespace: update-image-tags-yaml-test
  syncPolicy:
    syncOptions:
      - Validate=false
      - CreateNamespace=true
